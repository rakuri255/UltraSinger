[build-system]
requires = ["hatchling", "setuptools", "wheel", "setuptools_scm"]
build-backend = "hatchling.build"

[project]
name = "UltraSinger"
version = "0.0.13.dev16"
description = "A tool to create UltraStar karaoke files from audio files"
requires-python = ">=3.12,<3.14"
dependencies = [
    "setuptools",
    "scipy",
    "whisperx",
    "num2words",
    "inputimeout",
    "langcodes",
    "language_data",
    "packaging",
    "librosa",
    "swift-f0==0.1.2",
    "pydub",
    "demucs",
    "ffmpeg-python",
    "matplotlib",
    "musicbrainzngs",
    "Levenshtein",
    "pretty-midi",
    "unidecode",
    "pyhyphen",
    "tqdm",
    "yt-dlp[default]",
    "music21",
    "dataclasses",
    "dataclasses-json",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "chardet<6.0.0",
    "soundfile",
    "rich",
    "pillow",
    "audio-separator>=0.47.0",
    "onnxruntime-gpu==1.20.0",
    "torchcrepe>=0.0.24",
    "rmvpe-onnx>=0.2.3",
    "mir-eval>=0.8.2",
]

[project.optional-dependencies]
windows = []
linux = []
macos = []
dev = ["pytest", "isort", "black", "pylint"]

[dependency-groups]
dev = ["pytest", "isort", "black", "pylint"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
